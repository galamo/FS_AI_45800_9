<title>Request Round Trip</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one wide schematic stage (client · server · mysql) over a numbered step rail and transport controls. Single dark "control room" look by choice. */
:root{
  --ground:#0f1720;
  --panel:#16212d;
  --line:#2a3a4b;
  --ink:#e6edf3;
  --muted:#8297ab;
  --req:#5cc8ff;       /* request travelling out */
  --res:#ffb547;       /* response travelling back */
  --mysql:#4a9bc4;
  --ok:#3ddc97;
  --display:"Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme:dark;
}
html,body{background:var(--ground);color:var(--ink)}
body{font-family:var(--mono);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 40px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 24px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(1.5rem,3.4vw,2.2rem);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 em{font-style:normal;color:var(--req)}
h1 b{color:var(--res);font-weight:700}
.meta{color:var(--muted);font-size:.8rem;letter-spacing:.06em;text-transform:uppercase}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.stage svg{display:block;width:100%;height:auto}
svg text{font-family:var(--mono)}
.caption{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;min-height:3.2em}
.caption .n{font-family:var(--display);font-size:2rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;width:2.2ch}
.caption p{margin:0;font-size:.95rem;line-height:1.5;min-width:0}
.caption code{color:var(--req)}
.caption code.r{color:var(--res)}
.rail{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.rail div{height:4px;border-radius:2px;background:var(--line);transition:background .3s}
.rail div.on{background:var(--req)}
.rail div.on.back{background:var(--res)}
.rail div.on.done{background:var(--ok)}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button{font:500 .85rem var(--mono);color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:8px;padding:9px 16px;cursor:pointer;letter-spacing:.03em}
button:hover{border-color:var(--muted)}
button:focus-visible{outline:2px solid var(--req);outline-offset:2px}
button.primary{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.speed{margin-left:auto;display:flex;gap:4px;align-items:center;color:var(--muted);font-size:.8rem}
.speed button{padding:6px 10px}
.speed button[aria-pressed="true"]{border-color:var(--req);color:var(--req)}
@media (max-width:520px){.speed{margin-left:0}}
</style>

<div class="wrap">
  <header>
    <h1>Client → Server → Products API, <em>out</em> and <b>back</b></h1>
    <span class="meta">HTTP request lifecycle</span>
  </header>

  <div class="stage">
  <svg viewBox="0 0 960 440" role="img" aria-label="Animation of a client request travelling to a server, then to a Products API, and the response returning with 200 OK">
    <defs>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#1d2a38" stroke-width="1"/></pattern>
    </defs>
    <rect width="960" height="440" fill="url(#grid)"/>

    <!-- lanes -->
    <g stroke-width="2" fill="none" stroke-dasharray="4 6">
      <path d="M270 196 H372" stroke="#5cc8ff" opacity=".35"/>
      <path d="M588 196 H712" stroke="#5cc8ff" opacity=".35"/>
      <path d="M712 244 H588" stroke="#ffb547" opacity=".35"/>
      <path d="M372 244 H270" stroke="#ffb547" opacity=".35"/>
    </g>
    <text x="321" y="184" fill="#5cc8ff" font-size="10" text-anchor="middle" opacity=".7">HTTP</text>
    <text x="650" y="184" fill="#5cc8ff" font-size="10" text-anchor="middle" opacity=".7">HTTPS</text>

    <!-- CLIENT -->
    <g id="client">
      <rect id="clientFrame" x="40" y="90" width="230" height="260" rx="12" fill="#0f1720" stroke="#2a3a4b" stroke-width="2"/>
      <path d="M40 102a12 12 0 0 1 12-12h206a12 12 0 0 1 12 12v22H40z" fill="#1d2a38"/>
      <circle cx="58" cy="107" r="4" fill="#ff6b6b"/><circle cx="72" cy="107" r="4" fill="#ffb547"/><circle cx="86" cy="107" r="4" fill="#3ddc97"/>
      <rect x="100" y="99" width="158" height="16" rx="8" fill="#0f1720"/>
      <text x="110" y="111" fill="#8297ab" font-size="9.5">shop.example.com/products</text>
      <text x="56" y="150" fill="#e6edf3" font-size="12" font-weight="600">Products</text>
      <g id="rows">
        <g class="row" opacity="0"><rect x="56" y="164" width="198" height="30" rx="6" fill="#16212d"/><rect x="65" y="172" width="14" height="14" rx="3" fill="#5cc8ff" opacity=".6"/><text x="86" y="183" fill="#e6edf3" font-size="11">Wireless Mouse</text><text x="244" y="183" fill="#8297ab" font-size="10.5" text-anchor="end">$29</text></g>
        <g class="row" opacity="0"><rect x="56" y="200" width="198" height="30" rx="6" fill="#16212d"/><rect x="65" y="208" width="14" height="14" rx="3" fill="#ffb547" opacity=".6"/><text x="86" y="219" fill="#e6edf3" font-size="11">USB-C Hub</text><text x="244" y="219" fill="#8297ab" font-size="10.5" text-anchor="end">$45</text></g>
        <g class="row" opacity="0"><rect x="56" y="236" width="198" height="30" rx="6" fill="#16212d"/><rect x="65" y="244" width="14" height="14" rx="3" fill="#3ddc97" opacity=".6"/><text x="86" y="255" fill="#e6edf3" font-size="11">Mech Keyboard</text><text x="244" y="255" fill="#8297ab" font-size="10.5" text-anchor="end">$89</text></g>
      </g>
      <g id="skeleton">
        <rect x="56" y="164" width="198" height="30" rx="6" fill="#16212d" opacity=".5"/>
        <rect x="56" y="200" width="198" height="30" rx="6" fill="#16212d" opacity=".5"/>
        <rect x="56" y="236" width="198" height="30" rx="6" fill="#16212d" opacity=".5"/>
      </g>
      <g id="spinner" opacity="0"><circle cx="155" cy="300" r="9" fill="none" stroke="#2a3a4b" stroke-width="3"/><path id="spinArc" d="M155 291a9 9 0 0 1 9 9" fill="none" stroke="#5cc8ff" stroke-width="3" stroke-linecap="round"/></g>
      <rect id="btn" x="56" y="284" width="198" height="34" rx="8" fill="#5cc8ff"/>
      <text id="btnText" x="155" y="305" fill="#0f1720" font-size="11.5" font-weight="600" text-anchor="middle">Load products</text>
      <text x="155" y="378" fill="#8297ab" font-size="11" text-anchor="middle" letter-spacing="2">CLIENT</text>
      <text x="155" y="394" fill="#4d6276" font-size="9.5" text-anchor="middle">browser · React app</text>
    </g>

    <!-- SERVER -->
    <g id="server">
      <rect id="serverFrame" x="380" y="110" width="200" height="220" rx="12" fill="#0f1720" stroke="#2a3a4b" stroke-width="2"/>
      <g id="units">
        <g><rect x="400" y="130" width="160" height="40" rx="6" fill="#1d2a38"/><circle class="led" cx="418" cy="150" r="4" fill="#2a3a4b"/><circle class="led" cx="432" cy="150" r="4" fill="#2a3a4b"/><rect x="460" y="146" width="84" height="8" rx="4" fill="#16212d"/></g>
        <g><rect x="400" y="180" width="160" height="40" rx="6" fill="#1d2a38"/><circle class="led" cx="418" cy="200" r="4" fill="#2a3a4b"/><circle class="led" cx="432" cy="200" r="4" fill="#2a3a4b"/><rect x="460" y="196" width="84" height="8" rx="4" fill="#16212d"/></g>
        <g><rect x="400" y="230" width="160" height="40" rx="6" fill="#1d2a38"/><circle class="led" cx="418" cy="250" r="4" fill="#2a3a4b"/><circle class="led" cx="432" cy="250" r="4" fill="#2a3a4b"/><rect x="460" y="246" width="84" height="8" rx="4" fill="#16212d"/></g>
      </g>
      <text id="serverLog" x="480" y="300" fill="#4d6276" font-size="10" text-anchor="middle">listening on :8080</text>
      <text x="480" y="378" fill="#8297ab" font-size="11" text-anchor="middle" letter-spacing="2">SERVER</text>
      <text x="480" y="394" fill="#4d6276" font-size="9.5" text-anchor="middle">Node.js · Express API</text>
    </g>

    <!-- PRODUCTS API -->
    <g id="db">
      <rect id="apiFrame" x="712" y="110" width="200" height="220" rx="12" fill="#0f1720" stroke="#2a3a4b" stroke-width="2"/>
      <path d="M712 122a12 12 0 0 1 12-12h176a12 12 0 0 1 12 12v32H712z" fill="#1d2a38"/>
      <text x="736" y="138" fill="#4a9bc4" font-size="15" font-weight="600">{ }</text>
      <text x="766" y="137" fill="#e6edf3" font-size="12" font-weight="600">Products API</text>
      <text x="730" y="178" fill="#8297ab" font-size="9.5">GET /v1/products</text>
      <g id="dbRows" font-size="9.5">
        <g class="dr" opacity="0"><rect x="728" y="192" width="168" height="30" rx="5" fill="#16212d" stroke="#4a9bc4" stroke-opacity=".5"/><text x="738" y="211" fill="#4a9bc4">{ id: 101, sku: "MSE-01" }</text></g>
        <g class="dr" opacity="0"><rect x="728" y="228" width="168" height="30" rx="5" fill="#16212d" stroke="#4a9bc4" stroke-opacity=".5"/><text x="738" y="247" fill="#4a9bc4">{ id: 102, sku: "HUB-C4" }</text></g>
        <g class="dr" opacity="0"><rect x="728" y="264" width="168" height="30" rx="5" fill="#16212d" stroke="#4a9bc4" stroke-opacity=".5"/><text x="738" y="283" fill="#4a9bc4">{ id: 103, sku: "KBD-M2" }</text></g>
      </g>
      <text x="812" y="316" fill="#4d6276" font-size="9.5" text-anchor="middle">products.example.com</text>
      <text x="812" y="378" fill="#8297ab" font-size="11" text-anchor="middle" letter-spacing="2">PRODUCTS API</text>
      <text x="812" y="394" fill="#4d6276" font-size="9.5" text-anchor="middle">REST · JSON</text>
    </g>

    <!-- travelling packet -->
    <g id="packet" opacity="0">
      <rect id="pill" x="-80" y="-40" width="160" height="24" rx="12" fill="#16212d" stroke="#5cc8ff" stroke-width="1.5"/>
      <text id="pillText" x="0" y="-24" fill="#5cc8ff" font-size="10.5" font-weight="500" text-anchor="middle">GET /api/users</text>
      <circle id="dot" r="7" fill="#5cc8ff" filter="url(#glow)"/>
    </g>

    <!-- 200 OK toast -->
    <g id="toast" opacity="0" transform="translate(155 60)">
      <g id="toastInner">
        <rect x="-86" y="-20" width="172" height="40" rx="20" fill="#3ddc97" filter="url(#glow)"/>
        <circle cx="-62" cy="0" r="11" fill="#0f1720"/>
        <path d="M-67 0l4 4 7-8" fill="none" stroke="#3ddc97" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="8" y="5" fill="#0f1720" font-size="15" font-weight="600" text-anchor="middle">200 OK</text>
      </g>
    </g>
  </svg>
  </div>

  <div class="caption" aria-live="polite"><span class="n" id="stepN">0</span><p id="stepText">Press play to send a request.</p></div>
  <div class="rail" id="rail"><div></div><div></div><div></div><div></div><div></div><div></div></div>

  <div class="controls">
    <button class="primary" id="play" type="button">Pause</button>
    <button id="replay" type="button">Replay</button>
    <div class="speed" role="group" aria-label="Speed">Speed
      <button type="button" data-s="0.5" aria-pressed="false">0.5×</button>
      <button type="button" data-s="1" aria-pressed="true">1×</button>
      <button type="button" data-s="2" aria-pressed="false">2×</button>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const REQ = '#5cc8ff', RES = '#ffb547';
  const packet=$('packet'), pill=$('pill'), pillText=$('pillText'), dot=$('dot');
  const rows=[...document.querySelectorAll('.row')], skeleton=$('skeleton');
  const leds=[...document.querySelectorAll('.led')], dr=[...document.querySelectorAll('.dr')];
  const toast=$('toast'), toastInner=$('toastInner');
  const stepN=$('stepN'), stepText=$('stepText'), rail=[...$('rail').children];

  // timeline (seconds)
  const phases = [
    {k:'idle',   d:0.9},
    {k:'click',  d:0.5, step:1, txt:'User clicks <b>Load products</b>. The client sends <code>GET /api/products</code>.'},
    {k:'toSrv',  d:1.3, step:1, from:[270,196], to:[380,196], label:'GET /api/products', c:REQ},
    {k:'srv',    d:0.8, step:2, txt:'The server receives the request, runs the route handler and prepares a call to the Products API.'},
    {k:'toDb',   d:1.3, step:3, from:[580,196], to:[712,196], label:'GET /v1/products', c:REQ, txt:'Server calls the Products API: <code>GET /v1/products</code>.'},
    {k:'db',     d:1.0, step:4, txt:'The Products API looks up the catalog and returns 3 products as JSON.'},
    {k:'fromDb', d:1.3, step:5, from:[712,244], to:[580,244], label:'200 · 3 products', c:RES, txt:'The product list travels back to the server, which shapes it for the client.'},
    {k:'srv2',   d:0.5, step:5},
    {k:'toCli',  d:1.3, step:6, from:[380,244], to:[270,244], label:'200 · application/json', c:RES, txt:'Server responds <code class="r">HTTP 200 OK</code> with the JSON body.'},
    {k:'done',   d:2.8, step:6, txt:'The client renders the products and shows <b>200 OK</b>. Round trip complete.'},
  ];
  const total = phases.reduce((a,p)=>a+p.d,0);
  let t=0, speed=1, playing=true, last=null;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) { playing=false; }

  const ease = x => x<.5 ? 4*x*x*x : 1-Math.pow(-2*x+2,3)/2;
  const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
  const back = x => { const c1=1.70158,c3=c1+1; return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2); };

  function render(){
    let acc=0, ph, local=0, idx=0;
    for (let i=0;i<phases.length;i++){ if (t < acc+phases[i].d || i===phases.length-1){ ph=phases[i]; idx=i; local=clamp((t-acc)/ph.d); break;} acc+=phases[i].d; }

    // step caption
    let txtPhase = ph; for (let i=idx;i>=0 && !txtPhase.txt;i--) txtPhase=phases[i];
    if (ph.k==='idle'){ stepN.textContent='0'; stepText.innerHTML='Waiting for the user…'; }
    else { stepN.textContent=ph.step; if (txtPhase.txt && stepText.innerHTML!==txtPhase.txt) stepText.innerHTML=txtPhase.txt; }
    rail.forEach((r,i)=>{ const on = ph.step && i<ph.step; r.className = on ? 'on'+(i>=4?' back':'')+(ph.k==='done'?' done':'') : ''; });

    // client state
    const after = k => phases.findIndex(p=>p.k===k) < idx || (ph.k===k);
    const loading = idx>=1 && idx<9;
    $('btn').setAttribute('fill', ph.k==='click' ? '#8fdcff' : (loading ? '#1d2a38' : '#5cc8ff'));
    $('btnText').setAttribute('fill', loading ? '#8297ab' : '#0f1720');
    $('btnText').textContent = loading ? 'Loading…' : (ph.k==='done' ? 'Reload' : 'Load users');
    $('spinner').setAttribute('opacity', 0);
    $('clientFrame').setAttribute('stroke', (ph.k==='click'||ph.k==='done') ? (ph.k==='done'?'#3ddc97':REQ) : '#2a3a4b');

    // rows
    const doneP = ph.k==='done' ? local*ph.d : -1;
    rows.forEach((r,i)=>{ const o = clamp((doneP - i*0.12)/0.3); r.setAttribute('opacity', o); r.setAttribute('transform', `translate(${(1-o)*-8} 0)`); });
    skeleton.setAttribute('opacity', ph.k==='done' ? 1-clamp(doneP/0.3) : 1);

    // server
    const srvActive = ph.k==='srv'||ph.k==='srv2'||ph.k==='toDb'||ph.k==='fromDb';
    $('serverFrame').setAttribute('stroke', (ph.k==='srv'||ph.k==='srv2') ? (ph.k==='srv2'?RES:REQ) : '#2a3a4b');
    leds.forEach((l,i)=>{ const blink = srvActive && (Math.floor(t*12+i*1.7)%3===0); l.setAttribute('fill', blink ? (idx>=6?RES:'#3ddc97') : '#2a3a4b'); });
    const log = {srv:'GET /api/products → handler', toDb:'awaiting products api…', db:'awaiting products api…', fromDb:'products received', srv2:'res.json(rows)', toCli:'200 sent · 41ms', done:'200 sent · 41ms'}[ph.k] || 'listening on :8080';
    $('serverLog').textContent = log;
    $('serverLog').setAttribute('fill', log.startsWith('listening') ? '#4d6276' : '#8297ab');

    // db
    const dbOn = ph.k==='db';
    dr.forEach((r,i)=>{ const o = dbOn ? clamp((local*ph.d - i*0.18)/0.25)*0.55 : (ph.k==='fromDb' ? 0.55*(1-local) : 0); r.setAttribute('opacity', o*1.8); });
    $('apiFrame').setAttribute('stroke', dbOn ? '#4a9bc4' : '#2a3a4b');

    // packet
    if (ph.from){
      const e=ease(local), x=ph.from[0]+(ph.to[0]-ph.from[0])*e, y=ph.from[1];
      packet.setAttribute('opacity', Math.min(1, local*6, (1-local)*6+0.2));
      packet.setAttribute('transform', `translate(${x} ${y})`);
      const w = ph.label.length*6.6+28;
      pill.setAttribute('x', -w/2); pill.setAttribute('width', w); pill.setAttribute('stroke', ph.c);
      pill.setAttribute('y', ph.c===RES ? 16 : -40);
      pillText.setAttribute('y', ph.c===RES ? 32 : -24);
      pillText.textContent = ph.label; pillText.setAttribute('fill', ph.c); dot.setAttribute('fill', ph.c);
    } else packet.setAttribute('opacity', 0);

    // toast
    if (ph.k==='done'){
      const s = clamp(doneP/0.45), out = clamp((doneP-2.3)/0.4);
      const sc = back(s)*(1-out*0.15);
      toast.setAttribute('opacity', s*(1-out));
      toastInner.setAttribute('transform', `translate(0 ${(1-s)*14 - out*8}) scale(${Math.max(sc,0.01)})`);
    } else toast.setAttribute('opacity', 0);
  }

  function frame(ts){
    if (last==null) last=ts;
    const dt = Math.min(0.1,(ts-last)/1000); last=ts;
    if (playing){ t += dt*speed; if (t>=total) t=0; }
    render();
    requestAnimationFrame(frame);
  }

  const playBtn=$('play');
  const syncBtn=()=>playBtn.textContent = playing ? 'Pause' : 'Play';
  playBtn.addEventListener('click',()=>{ playing=!playing; syncBtn(); });
  $('replay').addEventListener('click',()=>{ t=0; playing=true; syncBtn(); });
  document.querySelectorAll('.speed button').forEach(b=>b.addEventListener('click',()=>{
    speed=+b.dataset.s; document.querySelectorAll('.speed button').forEach(x=>x.setAttribute('aria-pressed', x===b));
  }));
  if (reduce){ t = total - 1.5; }  // show the finished state at rest
  syncBtn();
  requestAnimationFrame(frame);
})();
</script>
